<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Inter",sans-serif;
  background:radial-gradient(900px 500px at 78% 15%,#1d3a63 0%,#0b1f3a 45%,#071527 100%);
  color:#fff;position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 80px}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.5px,transparent 1.5px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,black 35%,black 75%,transparent)}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.22),transparent 65%);top:-180px;right:-120px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:44px;position:relative}
.mark{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#c9a227,#8d6f14);display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:700;font-size:30px;color:#fff}
.bname{font-family:"Fraunces",serif;font-weight:600;font-size:26px;line-height:1.15}
.bname span{display:block;font-family:"Inter",sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em;color:#e3c766}
h1{font-family:"Fraunces",serif;font-weight:600;font-size:74px;line-height:1.08;max-width:900px;position:relative}
h1 em{font-style:italic;color:#e3c766}
.sub{font-size:26px;color:rgba(255,255,255,.78);margin-top:26px;max-width:760px;position:relative}
.badges{display:flex;gap:16px;margin-top:40px;position:relative}
.badge{border:1.5px solid rgba(227,199,102,.5);background:rgba(201,162,39,.14);color:#e3c766;border-radius:999px;padding:10px 26px;font-size:19px;font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#c9a227,#e3c766,#c9a227)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand">
  <div class="mark">M</div>
  <div class="bname">Meridian Business School<span>KUALA LUMPUR · 吉隆坡</span></div>
</div>
<h1>An accredited MBA in <em>as little as 12&nbsp;months.</em></h1>
<div class="sub">For working professionals in Malaysia · Weekend + online · Degree by [Global University]</div>
<div class="badges">
  <div class="badge">MQA Accredited</div>
  <div class="badge">HRD Corp Claimable</div>
  <div class="badge">No GMAT Required</div>
</div>
<div class="bar"></div>
</body>
</html>
