# Nginx reverse proxy for futurereadymba.com -> Next.js on port 3000
# Install:
#   sudo cp deploy/nginx-futurereadymba.conf /etc/nginx/sites-available/futurereadymba
#   sudo ln -s /etc/nginx/sites-available/futurereadymba /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY-HOSTINGER.md) to add the SSL 443 block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name futurereadymba.com www.futurereadymba.com;

    # Let Next serve its own static assets efficiently through the proxy.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
