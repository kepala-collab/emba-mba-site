name: Deploy to Vercel (Production)

# Auto-deploys the site to Vercel production on every push to main.
# Requires ONE repo secret: VERCEL_TOKEN
#   (Settings → Secrets and variables → Actions → New repository secret)
# The org/project IDs below are not secret — they identify the Vercel project.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: team_N8m5rbJn4kRt5mmsx0bvKGf7
  VERCEL_PROJECT_ID: prj_Hu9AB3suIXd0v2JcE2WoEUk7dV2A

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
