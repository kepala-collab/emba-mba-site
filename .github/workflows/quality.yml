name: Quality and release readiness

on:
  pull_request:
  push:
    branches: [main, "codex/**", "feat/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://futurereadymba.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: ci-turnstile-secret-not-used-for-network-calls
      TURNSTILE_HOSTNAMES: futurereadymba.com,www.futurereadymba.com
      LEAD_HASH_SECRET: ci-lead-hash-secret-0000000000000001
      GROQ_API_KEY: ci-server-only-key
      RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/pdf/requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:content
      - run: npm run audit:styles
      - run: npm run validate:env:contract
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run audit:seo
      - run: npm run audit:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run pdfs:check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
